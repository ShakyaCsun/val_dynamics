include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: ^3.1.8

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  trailing_commas: automate

linter:
  rules:
    async_return_with_no_await: true
    empty_container_bodies: true
    initialize_in_field_declaration: true
    no_raw_types: true
    no_dynamic_casts: true
    public_member_api_docs: false
    unnecessary_await_in_return: false # Conflicts with `async_return_with_no_await`
    unnecessary_const_in_enum_constructor: true
    unnecessary_primary_constructor_body: true
    use_declaring_parameters: true
    use_null_aware_elements: true
