include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: ^3.1.7

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  trailing_commas: automate

linter:
  rules:
    no_raw_types: true
    no_dynamic_casts: true
    public_member_api_docs: false
    use_null_aware_elements: true
