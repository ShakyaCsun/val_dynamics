name: vsdat
description: 'Valorant Style Dynamics Analysis Tool.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0-0
  flutter: '>=3.48.0-0'

workspace:
  - packages/agents_repository
  - packages/formz_inputs
  - packages/matches_repository
  - packages/valorant_agents
  - packages/vsdat_ui

dependencies:
  agents_repository:
    path: ./packages/agents_repository
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  formz: ^0.8.1
  formz_inputs:
    path: ./packages/formz_inputs
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  logging: ^1.3.0
  matches_repository:
    path: ./packages/matches_repository
  material_ui: ^1.1.1
  riverpod_annotation: ^4.0.7
  ternary_plot:
    git: https://github.com/ShakyaCsun/ternary_plot.git
  two_dimensional_scrollables: ^0.5.4
  url_launcher: ^6.3.2
  valorant_agents:
    path: ./packages/valorant_agents
  vector_graphics: ^1.2.3
  vsdat_ui:
    path: ./packages/vsdat_ui

dev_dependencies:
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  riverpod_generator: ^4.0.9
  vector_graphics_compiler: ^1.3.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/csv/agents/
    - assets/csv/matches/
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
